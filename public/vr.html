<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ErgoSim VR — Simulasi Ergonomi WebXR</title>
    <meta name="description" content="Simulasi ergonomi ruang kerja 3D dalam mode VR. Kompatibel dengan Meta Quest, HTC Vive, dan Windows Mixed Reality via WebXR." />

    <!-- A-Frame (WebXR-ready) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0a0918; font-family: 'Segoe UI', system-ui, sans-serif; }

      /* ── Info Panel (pojok kiri bawah) ── */
      #info-panel {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(10, 9, 24, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(99, 102, 241, 0.25);
        border-radius: 16px;
        padding: 18px 22px;
        color: #c4c4e0;
        max-width: 320px;
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #info-panel h2 {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 2px;
        background: linear-gradient(90deg, #818cf8, #f0abfc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #info-panel .subtitle {
        font-size: 12px;
        color: #8b8bb0;
        margin-bottom: 12px;
      }
      #info-panel ul {
        list-style: none;
        font-size: 12px;
        line-height: 1.8;
      }
      #info-panel ul li::before {
        content: '▸ ';
        color: #6366f1;
        font-weight: bold;
      }
      #info-panel .compat {
        margin-top: 12px;
        font-size: 11px;
        color: #6b6b90;
        border-top: 1px solid rgba(99, 102, 241, 0.15);
        padding-top: 10px;
      }

      /* ── Keterangan headset (pojok kanan bawah) ── */
      #vr-hint {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 10;
        background: rgba(10, 9, 24, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 12px;
        padding: 12px 18px;
        color: #a0a0c0;
        font-size: 12px;
        text-align: right;
        pointer-events: none;
      }
      #vr-hint strong { color: #818cf8; }

      /* ── Override A-Frame VR button styling ── */
      .a-enter-vr-button {
        background: linear-gradient(135deg, #6366f1, #8b5cf6) !important;
        border: none !important;
        border-radius: 14px !important;
        padding: 14px 28px !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        color: white !important;
        box-shadow: 0 12px 36px -8px rgba(99, 102, 241, 0.7) !important;
        cursor: pointer !important;
        transition: transform 0.15s, box-shadow 0.15s !important;
      }
      .a-enter-vr-button:hover {
        transform: scale(1.05) !important;
        box-shadow: 0 16px 44px -8px rgba(99, 102, 241, 0.85) !important;
      }

      /* ── VR mode: sembunyikan overlay ── */
      .a-fullscreen #info-panel,
      .a-fullscreen #vr-hint { display: none; }
    </style>
  </head>

  <body>
    <!-- ═══════════════════════════════════════════════════════
         A-FRAME SCENE — WebXR VR
         Kompatibel: Meta Quest, HTC Vive, Windows Mixed Reality
         ═══════════════════════════════════════════════════════ -->
    <a-scene
      vr-mode-ui="enabled: true"
      embedded
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; sortObjects: true"
      webxr="requiredFeatures: local-floor;
             optionalFeatures: bounded-floor, hand-tracking"
      shadow="type: pcfsoft; autoUpdate: true"
    >

      <!-- ═══ ASET (preload material) ═══ -->
      <a-assets>
        <!-- Tidak ada aset eksternal; semua geometri primitif -->
      </a-assets>


      <!-- ═══════════════════════════════════════════
           KAMERA + KONTROL
           - look-controls  : headset VR + mouse desktop
           - wasd-controls   : keyboard WASD
           - Posisi Y=1.6 m (tinggi mata rata-rata berdiri)
           ═══════════════════════════════════════════ -->
      <a-entity id="rig" position="0 0 0.9">
        <a-entity
          id="camera"
          camera
          look-controls="pointerLockEnabled: true"
          wasd-controls="acceleration: 20"
          position="0 1.6 0"
        >
          <!-- Crosshair (terlihat di desktop, tersembunyi di VR karena controller) -->
          <a-entity
            id="crosshair"
            cursor="fuse: false; rayOrigin: mouse"
            raycaster="far: 12; objects: .interactive"
            position="0 0 -0.6"
            geometry="primitive: ring; radiusInner: 0.004; radiusOuter: 0.007"
            material="color: #ffffff; shader: flat; opacity: 0.55"
          ></a-entity>
        </a-entity>
      </a-entity>


      <!-- ═══════════════════════════════════════════
           PENCAHAYAAN
           - Ambient  : cahaya latar merata
           - Directional : sinar utama (matahari/lampu langit-langit)
           - Point    : lampu meja (warm glow)
           ═══════════════════════════════════════════ -->
      <a-light
        type="ambient"
        color="#506080"
        intensity="0.5"
      ></a-light>

      <a-light
        type="directional"
        color="#FFFFFF"
        intensity="0.9"
        position="2 5 3"
        light="castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048"
      ></a-light>

      <a-light
        type="point"
        color="#E9B949"
        intensity="0.35"
        distance="3.5"
        decay="2"
        position="0.10 1.05 -1.72"
      ></a-light>


      <!-- ═══════════════════════════════════════════
           RUANGAN (lingkungan dasar)
           Ruang 8×4×8 m — lantai, 3 dinding, langit-langit
           ═══════════════════════════════════════════ -->

      <!-- Lantai -->
      <a-plane
        position="0 0 0" rotation="-90 0 0"
        width="8" height="8"
        material="color: #1e1e2e; roughness: 0.92; metalness: 0.05"
        shadow="receive: true"
      ></a-plane>

      <!-- Dinding Belakang -->
      <a-plane
        position="0 2 -4" width="8" height="4"
        material="color: #252540; roughness: 0.85"
      ></a-plane>

      <!-- Dinding Kiri -->
      <a-plane
        position="-4 2 0" rotation="0 90 0"
        width="8" height="4"
        material="color: #252540; roughness: 0.85"
      ></a-plane>

      <!-- Dinding Kanan -->
      <a-plane
        position="4 2 0" rotation="0 -90 0"
        width="8" height="4"
        material="color: #252540; roughness: 0.85"
      ></a-plane>

      <!-- Langit-langit -->
      <a-plane
        position="0 4 0" rotation="90 0 0"
        width="8" height="8"
        material="color: #161628; roughness: 1"
      ></a-plane>


      <!-- ═══════════════════════════════════════════
           FURNITUR — dari src/game/initialData.ts
           Posisi, dimensi, dan warna identik
           ═══════════════════════════════════════════ -->

      <!-- ─── Meja Kerja ─── -->
      <!-- Permukaan meja: pos(0, 0.61, -1.50) scale(1.55, 0.05, 0.82) #282A36 -->
      <a-box
        id="desk" class="interactive"
        position="0 0.61 -1.50"
        width="1.55" height="0.05" depth="0.82"
        material="color: #282A36; roughness: 0.55; metalness: 0.15"
        shadow="cast: true; receive: true"
      ></a-box>
      <!-- Kaki Meja (4 buah — bagian visual dari objek meja) -->
      <a-box position="-0.72 0.293 -1.87" width="0.04" height="0.585" depth="0.04"
             material="color: #20202e; roughness: 0.7"></a-box>
      <a-box position=" 0.72 0.293 -1.87" width="0.04" height="0.585" depth="0.04"
             material="color: #20202e; roughness: 0.7"></a-box>
      <a-box position="-0.72 0.293 -1.13" width="0.04" height="0.585" depth="0.04"
             material="color: #20202e; roughness: 0.7"></a-box>
      <a-box position=" 0.72 0.293 -1.13" width="0.04" height="0.585" depth="0.04"
             material="color: #20202e; roughness: 0.7"></a-box>


      <!-- ─── Kursi Kerja ─── -->
      <!-- Dudukan: pos(0, 0.34, -0.78) scale(0.48, 0.06, 0.48) rot(0,180,0) #2B2D42 -->
      <a-box
        id="chair-seat" class="interactive"
        position="0 0.34 -0.78" rotation="0 180 0"
        width="0.48" height="0.06" depth="0.48"
        material="color: #2B2D42; roughness: 0.7"
        shadow="cast: true; receive: true"
      ></a-box>
      <!-- Sandaran Kursi -->
      <a-box
        id="chair-back"
        position="0 0.62 -0.535"
        width="0.46" height="0.50" depth="0.04"
        material="color: #2B2D42; roughness: 0.7"
      ></a-box>
      <!-- Tiang Kursi -->
      <a-cylinder position="0 0.155 -0.78" radius="0.028" height="0.31"
                  material="color: #18182a; metalness: 0.3"></a-cylinder>
      <!-- Alas Bintang Kursi -->
      <a-cylinder position="0 0.01 -0.78" radius="0.22" height="0.02"
                  material="color: #18182a; metalness: 0.3"></a-cylinder>


      <!-- ─── Monitor ─── -->
      <!-- Bodi: pos(0, 1.22, -1.72) scale(0.58, 0.35, 0.03) #1B1B1F -->
      <a-box
        id="monitor" class="interactive"
        position="0 1.22 -1.72"
        width="0.58" height="0.35" depth="0.03"
        material="color: #1B1B1F; roughness: 0.25; metalness: 0.45"
        shadow="cast: true"
      ></a-box>
      <!-- Layar (emissive biru — menyala) -->
      <a-plane
        id="monitor-screen"
        position="0 1.22 -1.703"
        width="0.52" height="0.29"
        material="color: #2244aa; emissive: #1a3388; emissiveIntensity: 0.4; shader: flat; opacity: 0.9"
      ></a-plane>
      <!-- Tiang Monitor -->
      <a-box position="0 0.895 -1.72" width="0.045" height="0.36" depth="0.045"
             material="color: #1a1a28; metalness: 0.3"></a-box>
      <!-- Kaki Monitor -->
      <a-box position="0 0.67 -1.72" width="0.18" height="0.02" depth="0.13"
             material="color: #1a1a28; metalness: 0.3"></a-box>


      <!-- ─── Keyboard ─── -->
      <!-- pos(0, 0.645, -1.40) scale(0.44, 0.018, 0.15) #26262B -->
      <a-box
        id="keyboard" class="interactive"
        position="0 0.645 -1.40"
        width="0.44" height="0.018" depth="0.15"
        material="color: #26262B; roughness: 0.5; metalness: 0.1"
        shadow="cast: true"
      ></a-box>


      <!-- ─── Mouse ─── -->
      <!-- pos(0.55, 0.648, -1.40) scale(0.062, 0.028, 0.105) #1F1F24 -->
      <a-box
        id="mouse" class="interactive"
        position="0.55 0.648 -1.40"
        width="0.062" height="0.028" depth="0.105"
        material="color: #1F1F24; roughness: 0.35; metalness: 0.1"
        shadow="cast: true"
      ></a-box>


      <!-- ─── Lampu Meja ─── -->
      <!-- Tiang: pos(0.10, 0.79, -1.72) scale(0.05, 0.30, 0.05) #E9B949 -->
      <a-cylinder
        id="lamp" class="interactive"
        position="0.10 0.79 -1.72"
        radius="0.012" height="0.30"
        material="color: #E9B949; roughness: 0.35; metalness: 0.55"
        shadow="cast: true"
      ></a-cylinder>
      <!-- Alas Lampu -->
      <a-box
        position="0.10 0.64 -1.72"
        width="0.10" height="0.015" depth="0.10"
        material="color: #333340; roughness: 0.6"
      ></a-box>
      <!-- Tudung Lampu (emissive — bercahaya) -->
      <a-cone
        position="0.10 0.96 -1.72"
        radius-bottom="0.055" radius-top="0.02" height="0.055"
        material="color: #E9B949; emissive: #E9B949; emissiveIntensity: 0.6"
      ></a-cone>


      <!-- ═══ Langit / Background ═══ -->
      <a-sky color="#0a0918"></a-sky>

    </a-scene>


    <!-- ═══════════════════════════════════════════
         OVERLAY UI (di luar <a-scene>, HTML biasa)
         Tersembunyi otomatis saat masuk fullscreen VR
         ═══════════════════════════════════════════ -->

    <div id="info-panel">
      <h2>ErgoSim VR</h2>
      <p class="subtitle">Simulasi Ergonomi Ruang Kerja 3D</p>
      <ul>
        <li><strong>WASD</strong> untuk bergerak</li>
        <li><strong>Mouse / Headset</strong> untuk melihat sekeliling</li>
        <li>Klik tombol <strong>VR</strong> di pojok kanan bawah</li>
        <li>Tekan <strong>F</strong> untuk fullscreen</li>
      </ul>
      <p class="compat">
        Meta Quest &nbsp;·&nbsp; HTC Vive &nbsp;·&nbsp; Windows MR
      </p>
    </div>

    <div id="vr-hint">
      <strong>WebXR Ready</strong><br />
      Klik tombol VR untuk masuk<br />
      ke mode headset
    </div>


    <!-- ═══ Fullscreen toggle (F key) ═══ -->
    <script>
      document.addEventListener('keydown', function (e) {
        if (e.key === 'f' || e.key === 'F') {
          var scene = document.querySelector('a-scene');
          if (!document.fullscreenElement) {
            scene.requestFullscreen().catch(function () {});
          } else {
            document.exitFullscreen();
          }
        }
      });
    </script>

  </body>
</html>
